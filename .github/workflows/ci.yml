name: CI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: docker://rhysd/actionlint:1.7.12
      with:
        args: -color
  smoke:
    # Mirrors the Scheduled job's setup so action/Python bumps are exercised before merge;
    # the actual update is skipped because it pushes to the default branch.
    name: Smoke test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install starred
    - name: Check starred runs
      run: starred --help
