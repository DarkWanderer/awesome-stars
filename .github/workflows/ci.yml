name: CI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
      with:
        args: -color
  smoke:
    # Mirrors the Scheduled job's setup so action/Python bumps are exercised before merge;
    # the actual update is skipped because it pushes to the default branch.
    name: Smoke test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.15'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install starred
    - name: Check starred runs
      run: starred --help
